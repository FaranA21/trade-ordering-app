name: merchant_demo
description: Demo B2B trade ordering app and admin panel (Nexvorge concept, not client work).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Version ranges let pub pick the newest release that works with your
# Flutter SDK (tested floor: Flutter 3.27).
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: '>=8.1.6 <10.0.0'
  equatable: ^2.0.7
  go_router: '>=14.6.0 <17.0.0'
  data_table_2: '>=2.5.15 <3.0.0'
  fl_chart: '>=0.70.2 <2.0.0'
  intl: ^0.20.2
  google_fonts: '>=6.2.1 <7.0.0'
  firebase_core: '>=3.8.0 <5.0.0'
  firebase_auth: '>=5.3.4 <7.0.0'
  cloud_firestore: '>=5.5.1 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/products/
